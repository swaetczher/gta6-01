<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARUNIKA BAY — Fajar Terbit</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #1c2430; font-family: system-ui, sans-serif; }
  #app, #app canvas { display: block; width: 100%; height: 100%; }
  #hud { position: fixed; inset: 0; pointer-events: none; color: #fff; z-index: 5; }
  .hud-box { position: absolute; background: rgba(10, 14, 22, 0.62); border-radius: 8px; padding: 8px 12px; }
  #hud-wanted { top: 12px; left: 12px; font-size: 22px; letter-spacing: 2px; }
  #hud-money { top: 12px; left: 170px; font-size: 20px; font-weight: 700; }
  #hud-health { top: 52px; left: 12px; font-size: 18px; }
  #hud-weapon { top: 52px; left: 170px; font-size: 16px; }
  #hud-objective { top: 12px; right: 12px; max-width: 380px; font-size: 15px; text-align: right; }
  #hud-district { bottom: 12px; left: 12px; font-size: 15px; }
  #hud-dialog { bottom: 12px; left: 50%; transform: translateX(-50%); max-width: 640px; font-size: 16px; font-style: italic; text-align: center; }
  #hud-banner { position: absolute; top: 22%; left: 50%; transform: translateX(-50%); font-size: 34px; font-weight: 800; color: #ffd75e; background: rgba(10, 14, 22, 0.55); padding: 10px 22px; border-radius: 10px; }
  #hud-toast { position: absolute; top: 32%; left: 50%; transform: translateX(-50%); font-size: 17px; background: rgba(10, 14, 22, 0.62); padding: 8px 16px; border-radius: 8px; }
  #minimap { position: absolute; right: 12px; bottom: 12px; width: 190px; height: 190px; border: 2px solid rgba(255, 255, 255, 0.35); border-radius: 8px; background: #1c2430; }
  #menu-screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(20, 12, 28, 0.72); color: #fff; z-index: 10; text-align: center; }
  #menu-title { font-size: 44px; font-weight: 900; letter-spacing: 4px; color: #ffd75e; margin: 0 0 8px; }
  #menu-message { font-size: 17px; max-width: 560px; line-height: 1.5; margin: 0 0 22px; }
  #start-button { pointer-events: auto; font-size: 19px; font-weight: 700; padding: 12px 34px; border: none; border-radius: 10px; background: #e86a1a; color: #fff; cursor: pointer; }
  #start-button:hover { background: #f08a1a; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.min.js" } }
</script>
</head>
<body>
<div id="app"></div>
<div id="hud">
  <div id="hud-wanted" class="hud-box">☆☆☆☆☆</div>
  <div id="hud-money" class="hud-box">$50</div>
  <div id="hud-health" class="hud-box">❤100</div>
  <div id="hud-weapon" class="hud-box">Tinju</div>
  <div id="hud-objective" class="hud-box"></div>
  <div id="hud-district" class="hud-box">Distrik Niaga</div>
  <div id="hud-dialog" class="hud-box"></div>
  <div id="hud-banner" style="display:none"></div>
  <div id="hud-toast" style="display:none"></div>
  <canvas id="minimap" width="190" height="190"></canvas>
</div>
<div id="menu-screen">
  <h1 id="menu-title">ARUNIKA BAY</h1>
  <p id="menu-message">Fajar terbit di atas kota pelabuhan. Bara Kelana melawan geng Ombak Hitam pimpinan Rangga Samudra — lima misi sebelum matahari terbit.</p>
  <button id="start-button">Mulai Bermain</button>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>

<!-- Revisi ke-2 index.html: catatan staging untuk pengembang (bukan kode).
     Shot yang didukung: ?shot=cover | foot | heist | vista (+ alias chase,
     play, end) — masing-masing menyiapkan adegan + HUD lalu menandai
     window.__shotReady setelah 120 frame. Tanpa parameter shot, game
     berjalan normal dan menu awal menunggu tombol Mulai Bermain. -->
